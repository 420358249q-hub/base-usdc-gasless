[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "base-usdc-gasless-example"
version = "0.1.0"
description = "Typed EIP-3009 USDC transferWithAuthorization example for Base"
requires-python = ">=3.10"
dependencies = ["web3>=6.15,<8", "eth-account>=0.11,<0.14"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
base-usdc-transfer = "base_usdc_gasless.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
